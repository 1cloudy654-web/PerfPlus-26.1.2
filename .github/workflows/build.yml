name: Build PerfPlus JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract ZIP
        run: |
          unzip -o PerfPlus-26.1.2-.zip -d extracted

      - name: Find and build project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Nu am găsit build.gradle în arhivă!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PerfPlus-JAR
          path: "extracted/**/build/libs/*.jar"
