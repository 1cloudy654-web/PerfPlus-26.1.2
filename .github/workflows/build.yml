name: Build PerfPlus JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project
        run: |
          unzip -o PerfPlus-26.1.2-.zip -d extracted
          find extracted -name gradlew

      - name: Build
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name gradlew | head -1)")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PerfPlus-JAR
          path: "extracted/**/build/libs/*.jar"
