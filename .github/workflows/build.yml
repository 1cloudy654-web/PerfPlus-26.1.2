
name: Build PerfPlus JAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'PerfPlus-26.1.2-.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o "PerfPlus-26.1.2-.zip" -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name build.gradle | head -1)")"
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PerfPlus-JAR
          path: extracted/**/build/libs/*.jar
